<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="汇丰银行 - 保险产品持仓详情" />
    <title>您的持仓详情 - 保险产品</title>
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background-color:#f5f5f5;color:#333;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
      .page-wrapper{max-width:960px;margin:0 auto;padding:40px 32px 60px;position:relative}
      .page-title{display:flex;align-items:center;gap:14px;margin-bottom:40px}
      .title-bar{width:4px;height:28px;background-color:#8b1a1a;border-radius:2px;flex-shrink:0}
      .title-text{font-size:22px;font-weight:600;color:#1a1a1a;letter-spacing:1px}
      .section-header{display:flex;align-items:center;gap:10px;margin-bottom:24px}
      .section-icon{width:22px;height:22px;flex-shrink:0;color:#666}
      .section-number{font-size:16px;font-weight:600;color:#1a1a1a;letter-spacing:1px}
      .summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:48px}
      .summary-card{background-color:#f0f0f0;border-radius:8px;padding:24px 20px;text-align:center;transition:box-shadow .2s ease}
      .summary-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
      .card-label{font-size:14px;color:#666;margin-bottom:12px;font-weight:500}
      .card-value{font-size:32px;font-weight:700;color:#1a1a1a;margin-bottom:6px;line-height:1.2}
      .card-unit{font-size:12px;color:#999}
      .category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-bottom:40px}
      .category-card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:24px;transition:box-shadow .2s ease}
      .category-card:hover{box-shadow:0 2px 16px rgba(0,0,0,.06)}
      .category-title-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
      .category-icon{width:28px;height:28px;flex-shrink:0;color:#555}
      .category-name{font-size:16px;font-weight:600;color:#1a1a1a}
      .category-divider{height:1px;background-color:#eee;margin-bottom:16px}
      .category-details{list-style:none}
      .category-details li{display:flex;align-items:center;gap:8px;font-size:14px;color:#444;padding:6px 0}
      .detail-bullet{width:6px;height:6px;border-radius:50%;background-color:#333;flex-shrink:0}
      .detail-label{color:#555}
      .detail-value{color:#333;font-weight:500}
      .decor-icons{position:fixed;bottom:40px;right:40px;display:flex;flex-direction:column;gap:16px;opacity:.35;pointer-events:none}
      .decor-icon{width:48px;height:48px;color:#888}
      .decor-icon .cross-red{color:#8b1a1a}
      @media(max-width:768px){
        .page-wrapper{padding:24px 16px 40px}
        .summary-cards{grid-template-columns:repeat(2,1fr);gap:12px}
        .category-grid{grid-template-columns:1fr;gap:16px}
        .title-text{font-size:18px}
        .card-value{font-size:26px}
        .decor-icons{display:none}
      }
      @media(max-width:480px){
        .summary-cards{grid-template-columns:1fr 1fr;gap:10px}
        .summary-card{padding:16px 12px}
        .card-value{font-size:22px}
        .page-title{margin-bottom:28px}
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <!-- ===== Page Title ===== -->
      <div class="page-title">
        <div class="title-bar"></div>
        <h1 class="title-text">您的持仓详情——保险产品</h1>
      </div>

      <!-- ===== 01 保单总览 ===== -->
      <section class="section">
        <div class="section-header">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <span class="section-number">01 保单总览</span>
        </div>

        <div class="summary-cards">
          <div class="summary-card">
            <div class="card-label">保单个数</div>
            <div class="card-value">0</div>
            <div class="card-unit">(个)</div>
          </div>
          <div class="summary-card">
            <div class="card-label">现金价值</div>
            <div class="card-value">--</div>
            <div class="card-unit">(人民币)</div>
          </div>
          <div class="summary-card">
            <div class="card-label">保额</div>
            <div class="card-value">--</div>
            <div class="card-unit">(人民币)</div>
          </div>
          <div class="summary-card">
            <div class="card-label">总计待缴保费</div>
            <div class="card-value">--</div>
            <div class="card-unit">(人民币)</div>
          </div>
        </div>
      </section>

      <!-- ===== 保险分类详情 ===== -->
      <section class="section">
        <div class="category-grid">
          <!-- 投连险 -->
          <div class="category-card">
            <div class="category-title-row">
              <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <text x="9" y="16" font-size="8" fill="currentColor" stroke="none" font-weight="600">¥</text>
              </svg>
              <span class="category-name">投连险</span>
            </div>
            <div class="category-divider"></div>
            <ul class="category-details">
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">现金价值:</span>
                <span class="detail-value">--</span>
              </li>
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">保额:</span>
                <span class="detail-value">--</span>
              </li>
            </ul>
          </div>

          <!-- 终身寿险/两全险/重疾险 -->
          <div class="category-card">
            <div class="category-title-row">
              <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C8 2 4 6 4 10c0 6 8 12 8 12s8-6 8-12c0-4-4-8-8-8z"/>
                <line x1="12" y1="2" x2="12" y2="22"/>
                <path d="M12 8c-2 1-4 3-4 5"/>
                <path d="M12 8c2 1 4 3 4 5"/>
              </svg>
              <span class="category-name">终身寿险/两全险/重疾险</span>
            </div>
            <div class="category-divider"></div>
            <ul class="category-details">
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">现金价值:</span>
                <span class="detail-value">--</span>
              </li>
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">保额:</span>
                <span class="detail-value">--</span>
              </li>
            </ul>
          </div>

          <!-- 年金险 -->
          <div class="category-card">
            <div class="category-title-row">
              <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <polyline points="9 12 11 14 15 10"/>
              </svg>
              <span class="category-name">年金险</span>
            </div>
            <div class="category-divider"></div>
            <ul class="category-details">
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">现金价值:</span>
                <span class="detail-value">--</span>
              </li>
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">保额:</span>
                <span class="detail-value">--</span>
              </li>
            </ul>
          </div>

          <!-- 定期寿险/健康险 -->
          <div class="category-card">
            <div class="category-title-row">
              <svg class="category-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span class="category-name">定期寿险/健康险</span>
            </div>
            <div class="category-divider"></div>
            <ul class="category-details">
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">现金价值:</span>
                <span class="detail-value">--</span>
              </li>
              <li>
                <span class="detail-bullet"></span>
                <span class="detail-label">保额:</span>
                <span class="detail-value">--</span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <!-- ===== Decorative Icons (bottom-right) ===== -->
      <div class="decor-icons">
        <!-- Shield with cross -->
        <svg class="decor-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 44s16-8 16-20V10L24 4 8 10v14c0 12 16 20 16 20z"/>
          <line x1="24" y1="16" x2="24" y2="32" stroke="#8b1a1a" stroke-width="2.5"/>
          <line x1="16" y1="24" x2="32" y2="24" stroke="#8b1a1a" stroke-width="2.5"/>
        </svg>
        <!-- Folder icon -->
        <svg class="decor-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 10h14l4 4h18v24H6z"/>
          <circle cx="36" cy="14" r="4" fill="#8b1a1a" stroke="none"/>
        </svg>
      </div>
    </div>
  </body>
</html>
